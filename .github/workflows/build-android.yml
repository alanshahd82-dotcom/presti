name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Bundle JavaScript into APK
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (self-contained)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/PrestigeCars.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrestigeCars
          path: android/app/build/outputs/apk/debug/PrestigeCars.apk
          retention-days: 30

      - name: Delete old release asset & upload new APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete old assets from release v1.0 (id 359882741)
          for ID in $(gh api repos/${{ github.repository }}/releases/359882741/assets --jq '.[].id'); do
            gh api -X DELETE repos/${{ github.repository }}/releases/359882741/assets/$ID
          done
          # Upload new APK
          gh release upload v1.0 android/app/build/outputs/apk/debug/PrestigeCars.apk \
            --repo ${{ github.repository }} --clobber
