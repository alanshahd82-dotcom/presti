name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/PrestigeCars.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrestigeCars
          path: android/app/build/outputs/apk/release/PrestigeCars.apk
          retention-days: 30

      - name: Delete old release assets & upload new APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ID in $(gh api repos/${{ github.repository }}/releases/tags/v1.0 --jq '.assets[].id' 2>/dev/null || echo ""); do
            gh api -X DELETE repos/${{ github.repository }}/releases/assets/$ID
          done
          gh release upload v1.0 android/app/build/outputs/apk/release/PrestigeCars.apk \
            --repo ${{ github.repository }} --clobber
