name: 🚗 Build PrestiCars APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_note:
        description: 'ملاحظة الإصدار (اختياري)'
        required: false
        default: 'تحديث جديد'

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # ── 3. JDK 17 ──────────────────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Gradle cache ────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 5. Install JS deps ─────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Make gradlew executable ─────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 7. Bundle JS ───────────────────────────────────────────────────
      - name: Bundle JS (Metro)
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
        continue-on-error: false

      # ── 8. Build APK ───────────────────────────────────────────────────
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 9. Get build info ──────────────────────────────────────────────
      - name: Get version & date
        id: info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DATE=$(date +'%Y-%m-%d')
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "apk_name=PrestiCars-v${VERSION}-${DATE}.apk" >> $GITHUB_OUTPUT

      # ── 10. Rename APK ─────────────────────────────────────────────────
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/${{ steps.info.outputs.apk_name }}

      # ── 11. Upload artifact ────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrestiCars-APK-${{ steps.info.outputs.date }}
          path: android/app/build/outputs/apk/release/${{ steps.info.outputs.apk_name }}
          retention-days: 30

      # ── 12. Create/update GitHub Release ──────────────────────────────
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.info.outputs.version }}"
          APK_PATH="android/app/build/outputs/apk/release/${{ steps.info.outputs.apk_name }}"
          NOTE="${{ github.event.inputs.release_note || 'تحديث تلقائي عبر GitHub Actions' }}"

          # Create release if it doesn't exist
          if ! gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "PrestiCars $TAG" \
              --notes "## 🚗 PrestiCars $TAG

          $NOTE

          **التاريخ:** ${{ steps.info.outputs.date }}
          **Commit:** \`${{ steps.info.outputs.sha }}\`

          ### التثبيت
          1. حمّل ملف APK أدناه
          2. افتحه على جهازك الأندرويد
          3. اسمح بتثبيت التطبيقات من مصادر غير معروفة إذا طُلب منك"
          fi

          # Delete old APK assets with same tag (keep release fresh)
          for ASSET_ID in $(gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.assets[].id' 2>/dev/null || echo ""); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID" 2>/dev/null || true
          done

          # Upload new APK
          gh release upload "$TAG" "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --clobber

          echo "✅ APK uploaded to: $(gh release view $TAG --repo ${{ github.repository }} --json url -q '.url')"

      # ── 13. Summary ────────────────────────────────────────────────────
      - name: Job summary
        run: |
          echo "## 🚗 PrestiCars APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| المعلومة | القيمة |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| الإصدار | v${{ steps.info.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| التاريخ | ${{ steps.info.outputs.date }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit  | \`${{ steps.info.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| الملف   | ${{ steps.info.outputs.apk_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **تم بناء APK بنجاح وتحميله على GitHub Releases**" >> $GITHUB_STEP_SUMMARY
